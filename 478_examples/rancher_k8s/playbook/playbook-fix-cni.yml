---
# Repair Canal/Flannel on an already-running RKE2 cluster whose nodes are
# stuck NotReady because Flannel bound to the FABRIC management NIC.
#
# Usage (from the notebook directory):
#   ansible-playbook -i playbook/inventory.yml playbook/playbook-fix-cni.yml

- name: Fix Canal CNI for FABRIC dataplane
  hosts: rke2_servers
  become: true
  tasks:
    - name: Discover dataplane interface for private IP
      ansible.builtin.shell: |
        ip -o -4 addr show | awk '$4 ~ /^{{ private_ip }}\// {print $2; exit}'
      register: dataplane_iface
      changed_when: false
      failed_when: dataplane_iface.stdout | length == 0

    - name: Show dataplane interface
      ansible.builtin.debug:
        msg: "Pinning Canal/Flannel to iface {{ dataplane_iface.stdout }} (can-reach {{ rke2_server_private_ip }})"

    - name: Ensure server manifests directory exists
      ansible.builtin.file:
        path: /var/lib/rancher/rke2/server/manifests
        state: directory
        mode: "0755"

    - name: Write Canal HelmChartConfig for FABRIC dataplane
      ansible.builtin.copy:
        dest: /var/lib/rancher/rke2/server/manifests/rke2-canal-config.yaml
        mode: "0600"
        content: |
          apiVersion: helm.cattle.io/v1
          kind: HelmChartConfig
          metadata:
            name: rke2-canal
            namespace: kube-system
          spec:
            valuesContent: |-
              flannel:
                # Do not set iface by name: FABRIC NICs can differ per node.
                # iface-can-reach makes each node pick the L2 dataplane NIC.
                args:
                  - "--ip-masq"
                  - "--kube-subnet-mgr"
                  - "--iptables-forward-rules=false"
                  - "--ip-blackhole-route"
                  - "--iface-can-reach={{ rke2_server_private_ip }}"
              calico:
                ipAutoDetectionMethod: "can-reach={{ rke2_server_private_ip }}"

    - name: Apply Canal HelmChartConfig via kubectl
      ansible.builtin.command: >
        /var/lib/rancher/rke2/bin/kubectl
        --kubeconfig /etc/rancher/rke2/rke2.yaml
        apply -f /var/lib/rancher/rke2/server/manifests/rke2-canal-config.yaml
      register: apply_out
      changed_when: "'configured' in apply_out.stdout or 'created' in apply_out.stdout"

    - name: Wait briefly for Helm controller to reconcile chart values
      ansible.builtin.pause:
        seconds: 20

    - name: Patch Canal for dataplane API reachability and restart
      ansible.builtin.shell: |
        set -euo pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        KC=/etc/rancher/rke2/rke2.yaml
        API_IP="{{ rke2_server_private_ip }}"

        $K --kubeconfig "$KC" -n kube-system set env daemonset/rke2-canal \
          KUBERNETES_SERVICE_HOST="$API_IP" \
          KUBERNETES_SERVICE_PORT=6443

        $K --kubeconfig "$KC" -n kube-system get daemonset rke2-canal -o json \
          | python3 -c '
        import json, sys
        api_ip = sys.argv[1]
        ds = json.load(sys.stdin)
        want = f"--iface-can-reach={api_ip}"
        for c in ds["spec"]["template"]["spec"]["containers"]:
            if c["name"] != "flannel":
                continue
            args = c.get("args") or []
            # Drop any hard-coded --iface= so each node can resolve via can-reach.
            args = [a for a in args if not a.startswith("--iface-can-reach=") and not a.startswith("--iface=")]
            args.append(want)
            c["args"] = args
        json.dump(ds, sys.stdout)
        ' "$API_IP" | $K --kubeconfig "$KC" apply -f -

        $K --kubeconfig "$KC" -n kube-system rollout restart daemonset/rke2-canal
        $K --kubeconfig "$KC" -n kube-system rollout status daemonset/rke2-canal --timeout=300s
      args:
        executable: /bin/bash

    - name: Wait until nodes become Ready
      ansible.builtin.shell: |
        count=$(/var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml get nodes --no-headers 2>/dev/null | grep -c ' Ready' || true)
        echo "${count:-0}"
      register: ready_nodes
      retries: 36
      delay: 10
      until: (ready_nodes.stdout | trim | int) >= (groups['rke2_servers'] | length + groups['rke2_agents'] | length)
      changed_when: false

    - name: Show nodes
      ansible.builtin.command: >
        /var/lib/rancher/rke2/bin/kubectl
        --kubeconfig /etc/rancher/rke2/rke2.yaml
        get nodes -o wide
      register: nodes_out
      changed_when: false

    - name: Print nodes
      ansible.builtin.debug:
        var: nodes_out.stdout_lines

    - name: Show Canal / CoreDNS pods
      ansible.builtin.command: >
        /var/lib/rancher/rke2/bin/kubectl
        --kubeconfig /etc/rancher/rke2/rke2.yaml
        get pods -n kube-system -o wide
      register: sys_pods
      changed_when: false

    - name: Print system pods
      ansible.builtin.debug:
        var: sys_pods.stdout_lines
